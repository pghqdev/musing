<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Musing</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: light-dark(#fff, #202124);
      color: light-dark(#202124, #e8eaed);
      width: 350px;
      padding: 0;
      color-scheme: light dark;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 1rem;
      border-bottom: 1px solid light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.1));
    }

    .header img {
      width: 28px;
      height: 28px;
      border-radius: 6px;
    }

    .header-title {
      font-size: 1.125rem;
      font-weight: 600;
    }

    .section {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.1));
    }

    .section:last-child {
      border-bottom: none;
    }

    .section-title {
      font-size: 0.7rem;
      color: light-dark(#808080, #707070);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.625rem;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.375rem 0;
    }

    .setting-label {
      font-size: 0.8125rem;
    }

    .setting-sublabel {
      color: light-dark(#808080, #707070);
      font-size: 0.7rem;
      margin-top: 0.125rem;
    }

    select {
      background: light-dark(rgba(0, 0, 0, 0.05), rgba(255, 255, 255, 0.1));
      border: 1px solid light-dark(rgba(0, 0, 0, 0.15), rgba(255, 255, 255, 0.2));
      border-radius: 6px;
      padding: 0.375rem 0.625rem;
      color: inherit;
      font-size: 0.8125rem;
      cursor: pointer;
      min-width: 120px;
    }

    select:focus {
      outline: none;
      border-color: #4a9eff;
    }

    /* Toggle switch - compact */
    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: light-dark(rgba(0, 0, 0, 0.2), rgba(255, 255, 255, 0.2));
      border-radius: 22px;
      transition: 0.2s;
    }

    .toggle-slider::before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background: light-dark(#fff, #e8e8e8);
      border-radius: 50%;
      transition: 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: #4a9eff;
    }

    .toggle input:checked + .toggle-slider::before {
      transform: translateX(18px);
    }

    /* Sync row */
    .sync-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sync-info {
      font-size: 0.8125rem;
    }

    .sync-time {
      color: light-dark(#606060, #a0a0a0);
      font-size: 0.75rem;
    }

    .btn {
      background: #4a9eff;
      border: none;
      border-radius: 6px;
      padding: 0.375rem 0.75rem;
      color: #fff;
      font-size: 0.8125rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn:hover {
      background: #3a8eef;
    }

    .btn:disabled {
      background: light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.2));
      cursor: not-allowed;
    }

    .status {
      padding: 0.5rem 1rem;
      font-size: 0.75rem;
      text-align: center;
      background: rgba(74, 222, 128, 0.15);
      color: #4ade80;
      display: none;
    }

    .status.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="../icons/icon48.png" alt="Musing">
    <span class="header-title">Musing</span>
  </div>

  <div class="section">
    <div class="section-title">Sync</div>
    <div class="sync-row">
      <div>
        <div class="sync-info">Last synced</div>
        <div class="sync-time" id="last-sync">Never</div>
      </div>
      <button class="btn" id="sync-btn">Sync Now</button>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Data Sources</div>
    <div class="setting-row">
      <div>
        <div class="setting-label">Claude.ai</div>
        <div class="setting-sublabel">Extract themes from conversations</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enable-claude" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="setting-row">
      <div>
        <div class="setting-label">ChatGPT</div>
        <div class="setting-sublabel">Extract themes from conversations</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="enable-chatgpt" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Search</div>
    <div class="setting-row">
      <div class="setting-label">Search Engine</div>
      <select id="search-engine">
        <option value="google">Google</option>
        <option value="duckduckgo">DuckDuckGo</option>
        <option value="bing">Bing</option>
        <option value="brave">Brave Search</option>
      </select>
    </div>
  </div>

  <div class="status" id="status">Saved</div>

  <script src="popup.js"></script>
</body>
</html>
