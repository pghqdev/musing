<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Tab</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      background: light-dark(#fff, #202124);
      color: light-dark(#202124, #e8eaed);
      padding: 2rem;
      color-scheme: light dark;
    }

    .container {
      max-width: 700px;
      text-align: center;
      animation: fadeIn 0.6s ease-out;
      position: relative;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .quote {
      font-size: 1.75rem;
      line-height: 1.6;
      font-weight: 400;
      margin-bottom: 1.5rem;
      font-style: italic;
      color: light-dark(#202124, #f0f0f0);
      text-shadow: light-dark(none, 0 2px 4px rgba(0, 0, 0, 0.2));
    }

    .quote::before {
      content: '"';
      font-size: 3rem;
      color: light-dark(#1a73e8, #8ab4f8);
      line-height: 0;
      vertical-align: -0.4em;
      margin-right: 0.1em;
    }

    .quote::after {
      content: '"';
      font-size: 3rem;
      color: light-dark(#1a73e8, #8ab4f8);
      line-height: 0;
      vertical-align: -0.4em;
      margin-left: 0.1em;
    }

    .author {
      font-size: 1.1rem;
      color: light-dark(#5f6368, #9aa0a6);
      font-style: normal;
      letter-spacing: 0.05em;
    }

    .author::before {
      content: '— ';
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.75rem;
      color: light-dark(#5f6368, #9aa0a6);
    }

    .footer a {
      color: light-dark(#1a73e8, #8ab4f8);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    /* Loading state */
    .loading .quote,
    .loading .author {
      opacity: 0.3;
    }

    /* Loading indicator */
    .loading-indicator {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .loading-indicator.show {
      display: block;
    }

    .loading-spinner {
      width: 24px;
      height: 24px;
      border: 2px solid light-dark(rgba(0, 0, 0, 0.1), rgba(255, 255, 255, 0.1));
      border-top-color: light-dark(#1a73e8, #8ab4f8);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Skeleton loading for quote */
    .container.loading .quote::before,
    .container.loading .quote::after {
      opacity: 0.3;
    }

    /* Search bar (optional, minimal) */
    .search-container {
      margin-top: 3rem;
    }

    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 0.75rem 1.25rem;
      font-size: 1rem;
      border: 1px solid light-dark(#dfe1e5, #5f6368);
      border-radius: 24px;
      background: light-dark(#fff, rgba(255, 255, 255, 0.05));
      color: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
    }

    .search-input:focus {
      border-color: light-dark(#4a9eff, #8ab4f8);
      background: light-dark(#fff, rgba(255, 255, 255, 0.1));
      box-shadow: light-dark(0 1px 6px rgba(32, 33, 36, 0.28), none);
    }

    .search-input::placeholder {
      color: light-dark(#9aa0a6, #9aa0a6);
    }
  </style>
</head>
<body>
  <div class="container" id="container">
    <div class="loading-indicator" id="loading-indicator">
      <div class="loading-spinner"></div>
    </div>
    <p class="quote" id="quote">Loading wisdom...</p>
    <p class="author" id="author"></p>

    <div class="search-container">
      <input 
        type="text" 
        class="search-input" 
        id="search" 
        placeholder="Search Google..." 
        autofocus
      >
    </div>
  </div>

  <div class="footer">
    <a href="#" id="refresh">refresh</a>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
